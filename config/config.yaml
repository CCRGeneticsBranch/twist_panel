# Twist Bioscience UMI Panel Pipeline Configuration
# Based on: DOC-001337 TechNote - Processing Sequencing Data Utilizing UMI

# ---------------------------------------------------------------------------
# Samples
# 
# Samples must be provided via TSV (columns: Sample, R1, R2).
# R1/R2 values are filenames within raw_data_dir (not full paths).
# The TSV path may be absolute or relative to the run directory.
# ---------------------------------------------------------------------------
samples: "samples.tsv"

# ---------------------------------------------------------------------------
# Directories (use absolute paths)
# ---------------------------------------------------------------------------
raw_data_dir: "/path/to/raw/fastqs"   # input fastq file directory
results_dir:  "/path/to/output"        # output directory
logs_dir:     "/path/to/output/logs"   # log file directory

# ---------------------------------------------------------------------------
# Reference genome  (must be BWA-indexed)
# ---------------------------------------------------------------------------
reference_genome: "/fdb/bwa/indexes/hg38.fa"

# ---------------------------------------------------------------------------
# HPC module loading
# Recommended tool versions:
#  bwa        0.7.17
#  samtools   1.15.1
#  fgbio      1.5.1   (specifically required — newer versions change MergeBamAlignment)
#  picard     2.27.1
#  gatk       4.2.6.1
# ---------------------------------------------------------------------------
modules:
  fastqc:   "fastqc/0.11.9"
  multiqc:  "multiqc/1.12"
  python:   "python/3.9"
  bwa:      "bwa/0.7.17"
  samtools: "samtools/1.15.1"
  picard:   "picard/2.27.1"
  java:     "java/11"
  fgbio:    "fgbio/1.5.1"

# ---------------------------------------------------------------------------
# Computational resources
# ---------------------------------------------------------------------------
threads:   8
memory_gb: 4   # heap per tool (matches PDF: -Xmx4g)

# ---------------------------------------------------------------------------
# UMI configuration
# Regex to extract UMI1 and UMI2 from the fastq header read name.
# Default matches:  @...:GTCGT+CAGGA ...
#                         ^^^^^  ^^^^^  (5bp each)
# ---------------------------------------------------------------------------
umi_pattern: "(?P<umi_1>[ACGTN]+)\\+(?P<umi_2>[ACGTN]+)"

# ---------------------------------------------------------------------------
# fgbio read structure for ExtractUmisFromBam.
# Standard Twist inline libraries (5bp UMI + 2bp skip + template): "5M2S+T"
# Header-extracted UMIs prepended inline (no skip bases): "5M+T"
# Adjust if your UMIs are a different length or if skip bases were preserved.
# ---------------------------------------------------------------------------
umi_read_structure: "5M+T"

# ---------------------------------------------------------------------------
# fgbio GroupReadsByUmi parameters  (PDF step 7)
# ---------------------------------------------------------------------------
min_map_quality: 10
umi_edit_distance: 1

# ---------------------------------------------------------------------------
# fgbio CallDuplexConsensusReads parameters  (PDF step 8)
# --min-reads: "duplex_min first_strand_min second_strand_min"
# Twist recommends 2 1 1: duplex consensus requires ≥2 reads total,
# ≥1 from the top strand and ≥1 from the bottom strand.
# ---------------------------------------------------------------------------
error_rate_pre_umi: 45 
min_reads: "2 1 1"

# ---------------------------------------------------------------------------
# CollectHsMetrics  (PDF step 6)
# Provide Picard interval_list files for your capture panel.
# ---------------------------------------------------------------------------
bait_intervals:   ""   # path to probe/bait interval_list
target_intervals: ""   # path to target interval_list
probe_file: ""       # path to probe BED file for per-target coverage