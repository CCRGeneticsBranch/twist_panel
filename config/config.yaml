# Twist Bioscience UMI Panel Pipeline Configuration

# ---------------------------------------------------------------------------
# Samples
# 
# Samples must be provided via TSV (columns: Sample, R1, R2).
# R1/R2 values are filenames within raw_data_dir (not full paths).
# ---------------------------------------------------------------------------
samples: WORKDIR/config/samples.tsv

# ---------------------------------------------------------------------------
# Directories
# ---------------------------------------------------------------------------
raw_data_dir: "/path/to/raw/fastqs"   # input fastq file directory - absolute path
results_dir:  WORKDIR/results        # output directory
scriptsdir:    PIPELINE_HOME/workflow/scripts/ # scripts directory

# ---------------------------------------------------------------------------
# Reference genome
# ---------------------------------------------------------------------------
reference_genome: "/fdb/genomebrowser/fasta/hg38.fa"
reference_bwa: "/fdb/bwa/indexes/hg38.fa"

# ---------------------------------------------------------------------------
# HPC module loading
# Recommended tool versions:
#  bwa        0.7.17
#  samtools   1.15.1
#  fgbio      1.5.1   (specifically required — newer versions change MergeBamAlignment)
#  picard     2.27.1
#  gatk       4.2.6.1
# ---------------------------------------------------------------------------
modules:
  fastqc:   "fastqc"
  multiqc:  "multiqc"
  python:   "python"
  bwa:      "bwa/0.7.17"
  samtools: "samtools"
  picard:   "picard"
  java:     "java"
  fgbio:    "fgbio/2.0.2"

# ---------------------------------------------------------------------------
# UMI configuration
# Regex to extract UMI1 and UMI2 from the fastq header read name.
# Default matches:  @...:GTCGT+CAGGA ...
#                         ^^^^^  ^^^^^  (5bp each)
# ---------------------------------------------------------------------------
umi_pattern: "(?P<umi_1>[ACGTN]+)\\+(?P<umi_2>[ACGTN]+)"

# ---------------------------------------------------------------------------
# fgbio GroupReadsByUmi parameters  (PDF step 7)
# ---------------------------------------------------------------------------
min_map_quality: 10
umi_edit_distance: 1

# ---------------------------------------------------------------------------
# fgbio CallDuplexConsensusReads parameters  (PDF step 8)
# --min-reads: "duplex_min first_strand_min second_strand_min"
# Twist recommends 2 1 1: duplex consensus requires ≥2 reads total,
# ≥1 from the top strand and ≥1 from the bottom strand.
# ---------------------------------------------------------------------------
error_rate_pre_umi: 45 
min_reads: "2 1 1"

# ---------------------------------------------------------------------------
# CollectHsMetrics  (PDF step 6)
# Provide Picard interval_list files for your capture panel.
# ---------------------------------------------------------------------------
bait_intervals:   "PIPELINE_HOME/resources/NCI_RhadoSeqFoc_TE.baits.interval_list"   # path to probe/bait interval_list
target_intervals: "PIPELINE_HOME/resources/NCI_RhadoSeqFoc_TE.targets.interval_list"   # path to target interval_list